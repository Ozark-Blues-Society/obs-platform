# CI (backlog F-2): lint, typecheck, unit tests, build, database tests (pgTAP) and Playwright
# end-to-end tests, with local Supabase (backlog F-3) running in the runner.
#
# One job runs every check in turn. Each check runs even when an earlier one failed, so a single
# run reports every problem, and any failed check fails the job. It is one job rather than one per
# check because the repository is private on GitHub's free plan: 2,000 Actions minutes a month,
# with every job billed rounded up to the minute. One job installs dependencies once.
#
# Local Supabase starts in the background right after the install. While it comes up, the job runs
# lint, typecheck, the unit tests and the browser install. The database tests, the build and the
# end-to-end tests run once it is up.
#
# No secrets: CI uses test-mode or dummy values only (CLAUDE.md hard rules). The Supabase URL and
# key come from the local stack (`supabase status`): well-known demo values that only work against
# a local stack.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# CI only reads the code.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Each push to develop gets
# its own run, so every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    # Pinned rather than ubuntu-latest so a runner image change can't break Playwright's system
    # dependencies without warning.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the release tag is in the comment.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # 3.4.0 is the version the project was set up with; supabase/config.jsonc needs CLI 3.x. The
      # database tests don't need the Node dependencies, so this runs even when the install failed.
      - name: Set up the Supabase CLI
        id: supabase-cli
        if: ${{ !cancelled() }}
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.4.0

      # A fresh stack applies supabase/migrations/ and supabase/seed.sql. Starting it takes a while,
      # mostly pulling Docker images, so it runs in the background and "Wait for local Supabase"
      # picks up the result. Only Postgres and the services the app talks to start: the API gateway
      # (kong), Auth (gotrue), the REST API (postgrest), Storage (members-only files, backlog M-7)
      # and Mailpit, which catches Auth emails. When a test or a migration needs an excluded service
      # (Realtime...), drop it from the --exclude lists.
      - name: Start local Supabase in the background
        id: supabase-start
        if: ${{ !cancelled() && steps.supabase-cli.outcome == 'success' }}
        run: |
          (
            status=0
            supabase start \
              --exclude studio,postgres-meta,imgproxy,realtime \
              --exclude edge-runtime,logflare,vector,supavisor \
              || status=$?
            echo "$status" > "$RUNNER_TEMP/supabase-start.status.tmp"
            mv "$RUNNER_TEMP/supabase-start.status.tmp" "$RUNNER_TEMP/supabase-start.status"
          ) > "$RUNNER_TEMP/supabase-start.log" 2>&1 < /dev/null &

      # The checks below skip only when the run was cancelled or a step they need failed: the
      # install, the build or local Supabase.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      # Tests run headless, so the Chromium headless shell is all they need. Installing it before
      # the wait below overlaps it with the Supabase start.
      - name: Install Playwright's Chromium
        id: browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Joins the background start: prints its output and fails if it failed. Then it passes the
      # stack's API URL and publishable key to the later steps, so the build and the end-to-end
      # tests use the local stack. F-4 (typed env config, .env.example) owns these variable names;
      # keep the two in step.
      - name: Wait for local Supabase
        id: supabase
        if: ${{ !cancelled() && steps.supabase-start.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/supabase-start.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase-start.log"
          status="$(cat "$RUNNER_TEMP/supabase-start.status")"
          if [ "$status" != 0 ]; then
            echo "::error::supabase start failed with exit code $status"
            docker ps --all
            exit 1
          fi
          supabase status --output json > "$RUNNER_TEMP/supabase-status.json"
          url="$(jq -er .API_URL "$RUNNER_TEMP/supabase-status.json")"
          publishable_key="$(jq -er .PUBLISHABLE_KEY "$RUNNER_TEMP/supabase-status.json")"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
          } >> "$GITHUB_ENV"

      - name: Database tests (pgTAP)
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: pnpm test:db

      # Content in the end-to-end tests comes from a local stand-in for Sanity
      # (e2e/support/sanity-stand-in.mts), not from Sanity: CI has no Sanity project. Next.js reads
      # NEXT_PUBLIC_SANITY_PROJECT_ID when it builds, so the build gets the same made-up values that
      # playwright.config.ts gives the server. The stand-in isn't running yet, so the build's own
      # content reads fail at once and fall back, without calling Sanity.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: e2estandin
          SANITY_API_HOST_STAND_IN: http://127.0.0.1:3400
          SANITY_API_READ_TOKEN: e2e-stand-in-token
        run: pnpm build

      # With CI set, playwright.config.ts serves the production build (`pnpm start`) on port 3000.
      - name: End-to-end tests
        id: e2e
        if: >-
          ${{ !cancelled() && steps.browsers.outcome == 'success'
          && steps.build.outcome == 'success' && steps.supabase.outcome == 'success' }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
